[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conformalextract"
version = "0.0.0"
description = "Evidence-first selective certification for grounded event-argument extraction"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Ross King"}]
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
data = ["datasketch>=1.6,<2", "pyarrow>=18,<21"]
# Figure generation for the write-ups ONLY. Deliberately not a runtime dependency and not part of
# `dev`: nothing under src/ imports matplotlib, no test needs it, and the certified path must not
# grow a plotting library. `scripts/plot_risk_coverage.py` is the only consumer.
docs = ["matplotlib>=3.9,<4"]
train = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
  "datasets>=3.2,<5",
  "peft>=0.14,<1",
  "trackio>=0.8,<1",
  "transformers>=4.51,<5",
  "trl>=0.13,<1",
]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.122,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "scipy-stubs>=1.14,<2",
]

[project.scripts]
conformalextract = "conformalextract.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/conformalextract"]

[tool.hatch.build.targets.wheel.force-include]
"src/conformalextract/py.typed" = "conformalextract/py.typed"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["conformalextract"]
